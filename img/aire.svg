<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2332"/>
      <stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="acBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f5f5"/>
      <stop offset="1" stop-color="#d0d0d0"/>
    </linearGradient>
    <linearGradient id="cold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7AC11F" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7AC11F" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Room wall texture lines -->
  <g stroke="#2a3340" stroke-width="1" opacity="0.4">
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="550" x2="800" y2="550"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="500" width="800" height="100" fill="#0f1419"/>

  <!-- AC unit mounted on wall -->
  <g transform="translate(150, 100)">
    <!-- Shadow behind AC -->
    <ellipse cx="250" cy="220" rx="220" ry="12" fill="#000" opacity="0.4"/>

    <!-- Main body -->
    <rect x="0" y="20" width="500" height="180" rx="14" fill="url(#acBody)" stroke="#888" stroke-width="1"/>
    <!-- Top vent -->
    <rect x="20" y="40" width="460" height="20" rx="3" fill="#e0e0e0"/>
    <!-- Display panel -->
    <rect x="380" y="70" width="100" height="30" rx="4" fill="#1a1a1a"/>
    <circle cx="400" cy="85" r="3" fill="#7AC11F"/>
    <text x="420" y="89" font-family="monospace" font-size="11" fill="#7AC11F">22°C</text>
    <!-- Brand strip -->
    <rect x="20" y="100" width="120" height="50" rx="6" fill="#7AC11F"/>
    <text x="80" y="132" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">MULTI</text>
    <!-- Louver (bottom flap) - tilted down -->
    <path d="M 10 200 L 490 200 L 510 215 L 490 220 L 10 220 Z" fill="#bbb" stroke="#888" stroke-width="1"/>
    <!-- Cold air flowing down -->
    <path d="M 80 220 Q 100 280 90 340 Q 80 400 110 460" stroke="url(#cold)" stroke-width="14" fill="none" opacity="0.7" filter="url(#glow)"/>
    <path d="M 250 220 Q 240 290 250 360 Q 260 420 230 470" stroke="url(#cold)" stroke-width="14" fill="none" opacity="0.7" filter="url(#glow)"/>
    <path d="M 420 220 Q 430 290 410 360 Q 400 420 430 460" stroke="url(#cold)" stroke-width="14" fill="none" opacity="0.7" filter="url(#glow)"/>
  </g>

  <!-- Snowflake / cold symbol overlay -->
  <g transform="translate(620, 360)" opacity="0.8">
    <circle cx="0" cy="0" r="50" fill="#7AC11F" opacity="0.2"/>
    <g stroke="#7AC11F" stroke-width="3" stroke-linecap="round" fill="none">
      <line x1="0" y1="-30" x2="0" y2="30"/>
      <line x1="-26" y1="-15" x2="26" y2="15"/>
      <line x1="-26" y1="15" x2="26" y2="-15"/>
    </g>
  </g>

  <!-- Text -->
  <text x="400" y="540" font-family="Arial, sans-serif" font-size="14" fill="#7AC11F" text-anchor="middle" font-weight="bold" letter-spacing="3">CLIMATIZACIÓN</text>
  <text x="400" y="565" font-family="Arial, sans-serif" font-size="11" fill="#888" text-anchor="middle" letter-spacing="1">INSTALACIÓN Y MANTENCIÓN</text>
</svg>
